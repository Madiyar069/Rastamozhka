<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Калькулятор растаможки авто в Казахстан: пошлина, НДС, утильсбор, регистрация и госномер. Русский, қазақша, English.">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Растаможка авто Казахстан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* Layout: ночное «небо» с солнцем флага и номерным знаком в герое; ниже — форма-шаги слева и тёмная квитанция-итог справа (липкая), затем витрина госномеров и справочник */
:root{
  --bg:#f2f5f6; --paper:#ffffff; --ink:#0b1a22; --ink2:#3a4c57; --muted:#6a7c87; --line:#dde5e9; --soft:#edf2f4;
  --night:#06161e; --night2:#0b2a37; --on-night:#eaf3f6; --on-night2:#9db8c4; --night-line:rgba(234,243,246,.12);
  --sky:#0091ad; --sky-hi:#22b8d6; --gold:#e3aa12; --gold-hi:#f5c842; --err:#c2353a;
  --shadow:0 30px 60px -30px rgba(6,22,30,.45),0 2px 6px rgba(6,22,30,.05);
  --f-disp:"Unbounded","Onest","Segoe UI",Arial,sans-serif;
  --f-body:"Onest","Segoe UI",Arial,sans-serif;
  --f-plate:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050f15; --paper:#0b1c25; --ink:#e6f0f4; --ink2:#b3c6ce; --muted:#7f97a2; --line:#1a3340; --soft:#0f2530;
  --night:#030b10; --night2:#08202b; --on-night:#e6f0f4; --on-night2:#8eaab6; --night-line:rgba(230,240,244,.1);
  --sky:#2cc0de; --sky-hi:#5fd5ec; --gold:#f0bb32; --gold-hi:#f7d36a; --err:#f08a8e;
  --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050f15; --paper:#0b1c25; --ink:#e6f0f4; --ink2:#b3c6ce; --muted:#7f97a2; --line:#1a3340; --soft:#0f2530;
  --night:#030b10; --night2:#08202b; --on-night:#e6f0f4; --on-night2:#8eaab6; --night-line:rgba(230,240,244,.1);
  --sky:#2cc0de; --sky-hi:#5fd5ec; --gold:#f0bb32; --gold-hi:#f7d36a; --err:#f08a8e;
  --shadow:0 30px 60px -30px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
button{font-family:inherit}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:var(--on-night);
  background:radial-gradient(900px 500px at 85% 20%,color-mix(in srgb,var(--sky) 28%,transparent),transparent 60%),
             linear-gradient(180deg,var(--night2),var(--night) 75%);padding-bottom:150px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:var(--night-line)}
.sun{position:absolute;right:-120px;top:-140px;width:560px;height:560px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--gold-hi) 40%,transparent) 0 21%,transparent 22%),
             repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold-hi) 16%,transparent) 0 2.5deg,transparent 2.5deg 9deg);
  -webkit-mask:radial-gradient(circle,#000 0 25%,rgba(0,0,0,.55) 26%,transparent 68%);mask:radial-gradient(circle,#000 0 25%,rgba(0,0,0,.55) 26%,transparent 68%);opacity:.5;mix-blend-mode:screen}
.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--f-disp);font-size:14px;font-weight:500;letter-spacing:.01em;color:var(--on-night);text-decoration:none}
.logo .kzp{font-size:19px}
nav.links{display:flex;gap:4px}
nav.links a{color:var(--on-night2);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px}
nav.links a:hover{color:var(--on-night);background:var(--night-line)}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--night-line)}
.lang button{border:0;background:transparent;color:var(--on-night2);font-weight:600;font-size:13px;letter-spacing:.04em;padding:7px 13px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--on-night);color:var(--night)}
@media (max-width:820px){nav.links{display:none}}

.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-top:44px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-night2)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold)}
.hero h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,6vw,72px);line-height:1.02;letter-spacing:-.025em;margin-top:18px}
.hero h1 span{display:block;color:var(--sky-hi)}
.hero .lead{color:var(--on-night2);font-size:clamp(16px,1.6vw,19px);max-width:46ch;margin:20px 0 0}
.stats{display:flex;gap:0;margin-top:34px;flex-wrap:wrap}
.stat{padding:4px 28px 4px 0;margin-right:28px;border-right:1px solid var(--night-line);min-width:0}
.stat:last-child{border-right:0;margin-right:0}
.stat b{display:block;font-family:var(--f-disp);font-weight:500;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--on-night2)}
.hero-art{display:flex;justify-content:center}
.hero-art .kzp{font-size:clamp(44px,5.6vw,74px);transform:perspective(900px) rotateY(-16deg) rotateX(6deg) rotateZ(-3deg);
  box-shadow:0 40px 60px -20px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.06)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-art{justify-content:flex-start}.hero-art .kzp{font-size:40px;transform:rotateZ(-3deg)}}
@media (max-width:520px){.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding-right:10px;margin-right:10px}.stat b{font-size:19px}.stat span{font-size:12px;line-height:1.3;display:block}.sun{width:380px;height:380px;right:-160px;top:-120px}}
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .rise.d2{animation-delay:.08s}.rise.d3{animation-delay:.16s}.rise.d4{animation-delay:.24s}
  @keyframes rise{from{transform:translateY(14px);opacity:.25}to{transform:none;opacity:1}}
  .hero-art .kzp{animation:float 6s ease-in-out infinite}
  @keyframes float{50%{translate:0 -8px}}
}

/* ---------- KZ plate ---------- */
.kzp{display:inline-flex;align-items:stretch;background:#fbfbf8;color:#0c0c0c;border:.06em solid #0c0c0c;border-radius:.14em;
  font-family:var(--f-plate);font-weight:600;line-height:1;box-shadow:inset 0 0 0 .04em #fff;white-space:nowrap;max-width:100%}
.kzp .fl{background:#00a6c8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.12em .1em .08em;font-size:.36em;letter-spacing:.02em;border-radius:.3em 0 0 .3em;gap:.15em}
.kzp .fl i{display:block;width:1.05em;height:1.05em;border-radius:50%;background:#f7c616;box-shadow:0 0 0 .14em rgba(247,198,22,.35)}
.kzp .tx{padding:.1em .28em .06em;letter-spacing:.03em}
.kzp .rg{border-left:.06em solid #0c0c0c;padding:.1em .2em .06em;letter-spacing:.02em}

/* ---------- calculator ---------- */
.calc{position:relative;z-index:3;margin-top:-110px;display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:start}
.calc>div{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.form{padding:30px;display:grid;gap:26px}
.step{display:grid;gap:14px}
.step-h{display:flex;align-items:center;gap:12px}
.step-h .n{font-family:var(--f-disp);font-size:12px;font-weight:500;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--sky)}
.step-h h3{font-family:var(--f-disp);font-weight:500;font-size:15px;letter-spacing:-.01em}
.step+.step{padding-top:26px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:7px;min-width:0;align-content:start}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
input,select{width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 15px;min-height:52px;transition:border-color .15s,background .15s}
input:hover,select:hover{border-color:var(--line)}
input:focus,select:focus{outline:none;border-color:var(--sky);background:var(--paper);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 16%,transparent)}
input.up{text-transform:uppercase;letter-spacing:.03em;font-weight:600}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:44px;cursor:pointer}
.sel::after,.combo::after{content:"";position:absolute;right:18px;top:21px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.combo{position:relative}
.combo input{padding-right:44px;cursor:pointer}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:300px;overflow-y:auto;padding:6px}
.dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:500 15px var(--f-body);padding:10px 12px;border-radius:10px;cursor:pointer;letter-spacing:.02em}
.dd button:hover,.dd button.act{background:var(--soft);color:var(--sky)}
.dd .empty{padding:10px 12px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips button{font:600 13px var(--f-body);border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;transition:all .15s}
.chips button:hover{border-color:var(--sky);color:var(--sky)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--soft)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:12px 6px;border-radius:12px;cursor:pointer;transition:all .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(6,22,30,.12)}
.form-foot{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:4px}
.form-foot .field{width:170px}
.ghost{font:600 14px var(--f-body);background:none;border:1.5px solid var(--line);color:var(--ink2);border-radius:999px;padding:10px 18px;cursor:pointer}
.ghost:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- receipt ---------- */
.receipt{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--night);color:var(--on-night);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.receipt::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 260px at 100% 0,color-mix(in srgb,var(--sky) 22%,transparent),transparent 70%);pointer-events:none}
.rc{position:relative;padding:28px;display:grid;gap:22px}
.rc-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-night2)}
.rc-car{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px dashed var(--night-line)}
.rc-name{font-family:var(--f-disp);font-size:clamp(20px,2.2vw,26px);font-weight:500;letter-spacing:-.02em;line-height:1.15}
.rc-name b{font-weight:700;color:var(--sky-hi)}
.rc-meta{font-size:13px;color:var(--on-night2);margin-top:6px}
.rc-price{text-align:right}
.rc-price b{display:block;font-family:var(--f-disp);font-weight:500;font-size:18px}
.rc-price small{font-size:12px;color:var(--on-night2)}
.rc-note{margin:0;font-size:13px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--on-night);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.rc-note.err{background:color-mix(in srgb,var(--err) 16%,transparent);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.rc-total .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-night2)}
.rc-total .k span{text-transform:none;letter-spacing:0}
.rc-sum{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,4.6vw,54px);letter-spacing:-.035em;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-sum small{font-size:.5em;color:var(--gold-hi);margin-left:.15em;font-weight:500}
.bar{display:flex;height:8px;gap:3px;margin-top:18px}
.bar span{border-radius:4px;min-width:4px;transition:flex .5s cubic-bezier(.2,.7,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--on-night2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:8px;height:8px;border-radius:2px}
.grp h4{margin:0 0 4px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-night2);font-weight:600}
.grp h4 span{display:inline-flex;align-items:center;gap:8px}
.grp h4 i{width:8px;height:8px;border-radius:2px}
.ln{display:flex;align-items:baseline;gap:10px;padding:9px 0;font-size:15px}
.ln .nm{min-width:0}
.ln .nm small{display:block;font-size:12px;color:var(--on-night2)}
.ln i{flex:1;border-bottom:1px dotted color-mix(in srgb,var(--on-night) 25%,transparent);transform:translateY(-4px);min-width:12px}
.ln b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc-with{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px;border-radius:14px;background:var(--night-line);flex-wrap:wrap}
.rc-with span{font-size:14px;color:var(--on-night2)}
.rc-with b{font-family:var(--f-disp);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.rc-foot{margin:0;font-size:12px;color:var(--on-night2)}
.rc-edge{height:14px;background:radial-gradient(circle at 10px -3px,transparent 9px,var(--night) 10px) -10px 0/20px 14px repeat-x;margin-bottom:-1px}
.rc-empty{display:grid;gap:22px}
.rc-empty h2{font-family:var(--f-disp);font-weight:500;font-size:clamp(22px,2.4vw,28px);letter-spacing:-.02em;line-height:1.15}
.rc-empty p{margin:0;color:var(--on-night2)}
.inc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inc span{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--night-line);font-size:14px}
.inc span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.ghost-sum{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,4.6vw,54px);letter-spacing:-.035em;color:var(--night-line);-webkit-text-stroke:1px color-mix(in srgb,var(--on-night) 22%,transparent);line-height:1}
@media (max-width:960px){.calc{grid-template-columns:1fr}.receipt{position:relative;top:0}}
@media (max-width:480px){.rc-price{text-align:left}.rc-head span:last-child{white-space:nowrap}.grid2{grid-template-columns:1fr}.form,.rc{padding:22px}.inc{grid-template-columns:1fr}.form-foot .field{width:100%}}

/* ---------- sections ---------- */
section.block{padding-top:96px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.sec-head .eyebrow{color:var(--muted)}
.sec-head h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,3.6vw,44px);letter-spacing:-.03em;line-height:1.05;margin-top:12px}
.sec-head p{color:var(--muted);margin:0;max-width:40ch}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:16px;cursor:pointer;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--sky);box-shadow:var(--shadow)}
.pc.on{border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 20%,transparent)}
.pc .kzp{font-size:30px;justify-self:start}
.pc .nm{font-size:14px;color:var(--ink2);min-height:2.9em}
.pc .pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc .pr b{font-family:var(--f-disp);font-weight:500;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pc .pr small{font-size:12px;color:var(--muted)}
.pc .tag{position:absolute;top:-11px;right:18px;font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:999px;background:var(--gold);color:#1a1200}
.pc.vip{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 10%,var(--paper)),var(--paper) 60%);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}

.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
@media (max-width:560px){.toolbar{grid-template-columns:1fr}}
.tablebox{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px}
table.list{width:100%;border-collapse:collapse;font-size:15px}
.list th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:16px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.list .r{text-align:right}
.list tr:last-child td{border-bottom:0}
.list tbody tr[data-i]{cursor:pointer;transition:background .12s}
.list tbody tr[data-i]:hover{background:var(--soft)}
.list td.b{font-weight:600}
.list .pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600}
.list .go{color:var(--sky);font-weight:600;font-size:14px}
.count{font-size:13px;color:var(--muted);margin-top:10px}

footer{margin-top:110px;background:var(--night);color:var(--on-night2);font-size:13px}
footer .wrap{padding-block:36px 44px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
footer p{margin:4px 0;max-width:70ch}
footer .logo{margin-bottom:10px}
</style>
</head>
<body>

<header class="hero">
  <div class="sun" aria-hidden="true"></div>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="#calc"><span class="kzp" aria-hidden="true"><span class="fl"><i></i>KZ</span><span class="tx">777</span></span><span data-t="brand"></span></a>
      <nav class="links"><a href="#calc" data-t="navCalc"></a><a href="#plates" data-t="navPlates"></a><a href="#list" data-t="navList"></a></nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="kk">ҚАЗ</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>

/* ---------- data ---------- */
const CYR={"А":"A","В":"B","Е":"E","К":"K","М":"M","Н":"H","О":"O","Р":"P","С":"C","Т":"T","Х":"X"};
const norm=s=>String(s||"").toUpperCase().replace(/[АВЕКМНОРСТХ]/g,c=>CYR[c]).replace(/[^A-Z0-9]/g,"");
const ROWS=DATA.rows.map(r=>({b:DATA.brands[r[0]],m:r[1],v:r[2],y:r[3],p:r[4],old:r[5]===1,s:DATA.sources[r[6]]}));
const byBrand=new Map();
ROWS.forEach(r=>{if(!byBrand.has(r.b))byBrand.set(r.b,new Map());const mm=byBrand.get(r.b);if(!mm.has(r.m))mm.set(r.m,[]);mm.get(r.m).push(r);});
const BRANDS=[...byBrand.keys()];

let rateTouched=false, rateInfo={date:"31.10.2026",live:false};
function setRateLbl(){$("rateLbl").textContent=rateInfo.live?t("rateLive")(rateInfo.date):t("rateNbk");}
let lang="ru", eng="ice", engTouched=false, lastKey="", delivTouched=false, lastModel="", shownTotal=0;
try{const s=localStorage.getItem("lang");if(T[s])lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];
const loc=()=>lang==="en"?"en-US":"ru-RU";
const nf=n=>new Intl.NumberFormat(loc(),{maximumFractionDigits:2}).format(n);
const n0=n=>new Intl.NumberFormat(loc(),{maximumFractionDigits:0}).format(Math.round(n));
const kzt=n=>n0(n)+" ₸";
const usd=n=>"$"+nf(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const volTxt=v=>v===0?t("ev"):nf(v)+" "+t("cc");
const rate=()=>{const v=parseFloat(String($("rate").value).replace(",","."));return v>0?v:RATE_DEFAULT;};
const delivUsd=()=>{const v=parseFloat($("deliv").value);return v>=0?v:0;};
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const plateHTML=(a,b)=>`<span class="kzp" aria-hidden="true"><span class="fl"><i></i>KZ</span><span class="tx">${a} ${b}</span><span class="rg">02</span></span>`;

function lookup(list,input){
  const n=norm(input);if(!n)return{hit:null,sugg:[]};
  const ex=list.find(x=>norm(x)===n);if(ex)return{hit:ex,sugg:[]};
  const st=list.filter(x=>norm(x).startsWith(n));if(st.length===1)return{hit:st[0],sugg:[]};
  return{hit:null,sugg:(st.length?st:list.filter(x=>norm(x).includes(n))).slice(0,8)};
}
function parseVol(s){
  s=String(s||"").trim().toLowerCase().replace(",",".");if(!s)return null;
  if(/^(ev|эл|electric|гибрид|hybrid|электр)/.test(s))return 0;
  const v=parseFloat(s);if(!(v>=0))return null;
  return v<20?Math.round(v*1000):Math.round(v);
}
function pick(rows,year,vol){
  const notes=[];let pool=year<=2015?rows.filter(r=>r.old||r.y<=2015):rows.filter(r=>!r.old&&r.y===year);
  if(!pool.length){
    const ny=[...new Set(rows.map(r=>r.y))].sort((a,b)=>Math.abs(a-year)-Math.abs(b-year)||a-b)[0];
    pool=rows.filter(r=>r.y===ny);notes.push(t("noteYear")(year,pool[0].old?t("upTo2015"):ny));
  }
  let r;
  if(vol===null){r=pool.slice().sort((a,b)=>a.v-b.v)[0];if(new Set(pool.map(x=>x.v)).size>1)notes.push(t("noteVolEmpty")(volTxt(r.v)));}
  else{r=pool.slice().sort((a,b)=>Math.abs(a.v-vol)-Math.abs(b.v-vol)||b.p-a.p)[0];
    if(r.v!==vol&&!(r.v===0&&vol>0))notes.push(t("noteVol")(vol===0?t("ev"):nf(vol)+" "+t("cc"),volTxt(r.v)));}
  return{r,notes};
}

function compute(r,year,userVol){
  const rt=rate(), value=r.p*rt;
  const vol=r.v>0?r.v:(userVol>0?userVol:0);
  const duty=value*DUTY;
  const excise=(eng!=="ev"&&vol>3000)?vol*EXCISE_PER_CC:0;
  const vat=(value+duty+excise)*VAT;
  const fee=CUSTOMS_FEE_MRP*MRP;
  let utilK=0;if(eng!=="ev")utilK=UTIL_K(vol>0?vol:1500);
  const util=UTIL_BASE_MRP*utilK*MRP;
  const age=Math.max(0,CUR_YEAR-year);
  const reg=REG_MRP(age)*MRP*(eng==="ev"?0.5:1);
  const pl=PLATES.find(x=>x.id===$("plate").value)||null;
  const plate=pl?pl.mrp*MRP:0;
  const deliv=delivUsd()*rt;
  const customs=duty+excise+vat+fee, state=util+reg;
  return{value,duty,excise,vat,fee,customs,util,utilK,reg,age,pl,plate,deliv,state,total:customs+state+deliv+plate,vol};
}

/* ---------- render ---------- */
function chips(el,list,target){
  el.innerHTML=list.map(x=>`<button type="button">${esc(x)}</button>`).join("");
  [...el.querySelectorAll("button")].forEach((b,i)=>b.onclick=()=>{$(target).value=list[i];render();});
}
function optChips(el,items,target,cur){
  el.innerHTML=items.map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(l)}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{$(target).value=b.dataset.v;render();});
}
function setEng(v,manual){eng=v;if(manual)engTouched=true;document.querySelectorAll("#eng button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.eng===eng));}

function emptyState(msg,isErr){
  shownTotal=0;
  const inc=[t("lDuty"),t("lVat"),t("lFee"),t("lUtil"),t("lReg"),t("gPlate")];
  return `<div class="rc-head"><span>${esc(t("resTitle"))}</span><span class="tnum">$1 = ${nf(rate())} ₸</span></div>
    <div class="rc-empty">
      <div class="ghost-sum tnum">0 ₸</div>
      <div><h2>${esc(t("emptyTitle"))}</h2></div>
      <p class="rc-note${isErr?" err":""}" style="${isErr?"":"background:var(--night-line);border-color:transparent"}">${esc(msg)}</p>
      <div><div class="rc-head" style="margin-bottom:10px"><span>${esc(t("incTitle"))}</span></div>
      <div class="inc">${inc.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
    </div>`;
}
function animateSum(el,to){
  const from=shownTotal;shownTotal=to;
  const put=v=>{el.innerHTML=`${n0(v)}<small>₸</small>`;};
  if(reduced()||Math.abs(to-from)<1){put(to);return;}
  const t0=performance.now(),d=650;
  const step=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);put(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

function render(){
  const out=$("result");["brandChips","modelChips","yearChips","volChips"].forEach(id=>$(id).innerHTML="");
  const bIn=$("brand").value.trim();
  if(!bIn){out.innerHTML=emptyState(t("start"));return;}
  const bq=lookup(BRANDS,bIn);
  if(!bq.hit){out.innerHTML=emptyState(t("errBrand"),true);chips($("brandChips"),bq.sugg,"brand");return;}
  const mm=byBrand.get(bq.hit), models=[...mm.keys()];
  $("modelList").innerHTML=models.map(m=>`<option value="${esc(m)}">`).join("");
  const mIn=$("model").value.trim(), mq=lookup(models,mIn);
  if(!mq.hit){out.innerHTML=emptyState(mIn?t("errModel"):t("pickModel"),!!mIn);if(mIn)chips($("modelChips"),mq.sugg,"model");return;}
  const rows=mm.get(mq.hit);
  const mk=bq.hit+"|"+mq.hit;
  if(mk!==lastModel){lastModel=mk;$("year").value="";$("vol").value="";}
  const hasOld=rows.some(r=>r.old);
  const yearsAv=[...new Set(rows.map(r=>r.y))].sort((a,b)=>b-a);
  const yv=parseInt($("year").value,10);
  optChips($("yearChips"),yearsAv.map(y=>[String(y),(y===2015&&hasOld)?"≤ 2015":String(y)]),"year",String(yv));
  const vr=yv>1950?rows.filter(r=>yv<=2015?(r.old||r.y<=2015):(!r.old&&r.y===yv)):rows;
  const vols=[...new Set((vr.length?vr:rows).map(r=>r.v))].sort((a,b)=>a-b);
  const pv=parseVol($("vol").value);
  optChips($("volChips"),vols.map(v=>[v===0?"EV":String(v),v===0?t("ev"):nf(v)]),"vol",pv===null?"":pv===0?"EV":String(pv));
  $("volList").innerHTML=[...new Set(rows.map(r=>r.v))].sort((a,b)=>a-b).map(v=>`<option value="${v===0?"EV":v}">`).join("");
  const year=parseInt($("year").value,10);
  if(!(year>1950)){out.innerHTML=emptyState(t("errYear"));return;}
  const userVol=parseVol($("vol").value);
  const {r,notes}=pick(rows,year,userVol);
  const key=r.b+r.m+r.v;
  if(key!==lastKey){lastKey=key;if(!engTouched)setEng(r.v===0?"ev":"ice");}
  if(eng==="hyb"&&r.v===0&&!(userVol>0))notes.push(t("noteHybVol"));
  const c=compute(r,year,userVol);
  const cn=$("country").value, cName=cn?t("countries")[cn]:"";
  const parts=[["sky-hi",c.customs,"gCustoms"],["gold",c.state,"gState"],["on-night2",c.deliv,"gDeliv"],["on-night",c.plate,"gPlate"]].filter(p=>p[1]>0);
  const L=(name,sub,val)=>`<div class="ln"><span class="nm">${esc(name)}${sub?`<small>${esc(sub)}</small>`:""}</span><i></i><b>${kzt(val)}</b></div>`;
  const G=(col,title,sum,body)=>`<div class="grp"><h4><span><i style="background:var(--${col})"></i>${esc(title)}</span><span class="tnum">${kzt(sum)}</span></h4>${body}</div>`;
  out.innerHTML=`
   <div class="rc-head"><span>${esc(t("resTitle"))}</span><span class="tnum">$1 = ${nf(rate())} ₸</span></div>
   <div class="rc-car">
     <div><div class="rc-name">${esc(r.b)} <b>${esc(r.m)}</b></div><div class="rc-meta">${esc(r.old?t("upTo2015"):r.y)} · ${esc(c.vol>0?nf(c.vol)+" "+t("cc"):t("ev"))} · ${esc(t("src"))}: ${esc(r.s)}</div></div>
     <div class="rc-price"><small>${esc(t("refPrice"))}</small><b class="tnum">${usd(r.p)}</b><small class="tnum">${kzt(c.value)}</small></div>
   </div>
   ${notes.map(n=>`<p class="rc-note">${esc(n)}</p>`).join("")}
   <div class="rc-total">
     <div class="k">${esc(t("total"))} <span>· ${esc(t("totalSub"))}</span></div>
     <div class="rc-sum" id="sum"></div>
     <div class="bar">${parts.map(p=>`<span style="flex:${p[1]};background:var(--${p[0]})"></span>`).join("")}</div>
     <div class="legend">${parts.map(p=>`<span><i style="background:var(--${p[0]})"></i>${esc(t(p[2]))}</span>`).join("")}</div>
   </div>
   ${G("sky-hi",t("gCustoms"),c.customs,L(t("lDuty"),"",c.duty)+(c.excise?L(t("lExcise"),t("lExciseSub"),c.excise):"")+L(t("lVat"),t("lVatSub"),c.vat)+L(t("lFee"),t("lFeeSub"),c.fee))}
   ${G("gold",t("gState"),c.state,L(t("lUtil"),t("lUtilSub")(nf(c.utilK)),c.util)+L(t("lReg"),t("lRegSub")(c.age),c.reg))}

function combo(id,getItems){
  const inp=$(id),dd=$(id+"DD");let act=-1,items=[];
  const close=()=>{dd.hidden=true;inp.setAttribute("aria-expanded","false");act=-1;};
  const pick=v=>{inp.value=v;close();render();if(id==="brand"){$("model").value="";$("model").focus();}};
  const open=(browse)=>{
    const all=getItems(),n=norm(inp.value),exact=all.some(x=>norm(x)===n);
    if(!n||(browse&&exact))items=all;
    else items=all.filter(x=>norm(x).includes(n)).sort((a,b)=>(norm(b)===n)-(norm(a)===n)||(norm(b).startsWith(n))-(norm(a).startsWith(n)));
    if(act<0&&n){const ei=items.findIndex(x=>norm(x)===n);if(ei>=0)act=ei;}
    dd.innerHTML=items.length?items.map((x,i)=>`<button type="button" role="option" data-i="${i}" class="${i===act?"act":""}">${esc(x)}</button>`).join(""):`<div class="empty">${esc(t("none"))}</div>`;
    dd.hidden=false;inp.setAttribute("aria-expanded","true");
    dd.querySelector(".act")?.scrollIntoView({block:"nearest"});
  };
  const paint=()=>{dd.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("act",i===act));dd.querySelector(".act")?.scrollIntoView({block:"nearest"});};
  dd.addEventListener("mousedown",e=>{const b=e.target.closest("button");if(b){e.preventDefault();pick(items[+b.dataset.i]);}});
  inp.addEventListener("focus",()=>{act=-1;open(true);});
  inp.addEventListener("click",()=>{if(dd.hidden){act=-1;open(true);}});
  inp.addEventListener("input",()=>{act=-1;open();});
  inp.addEventListener("blur",()=>setTimeout(close,150));
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(dd.hidden)open(true);act=Math.max(0,Math.min(items.length-1,act+(e.key==="ArrowDown"?1:-1)));paint();dd.querySelector(".act")?.scrollIntoView({block:"nearest"});}
    else if(e.key==="Enter"&&!dd.hidden&&items.length){e.preventDefault();pick(items[act>=0?act:0]);}
    else if(e.key==="Escape")close();
  });
}

/* ---------- живой курс доллара ---------- */
const fmtDate=d=>{const x=new Date(d);return isNaN(x)?"":String(x.getUTCDate()).padStart(2,"0")+"."+String(x.getUTCMonth()+1).padStart(2,"0")+"."+x.getUTCFullYear();};
function useRate(v,d){
  if(rateTouched||!(v>300&&v<1000))return false;
  $("rate").value=Math.round(v*100)/100;rateInfo={date:d,live:true};
  $("rateShow").textContent=nf(rate())+" ₸";setRateLbl();render();renderList();return true;
}
(async()=>{
  try{const c=JSON.parse(localStorage.getItem("usdkzt")||"null");if(c&&Date.now()-c.ts<12*3600e3)useRate(c.v,c.d);}catch(e){}
  const SRC=[
    ["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json",j=>[j.usd&&j.usd.kzt,fmtDate(j.date)]],
    ["https://latest.currency-api.pages.dev/v1/currencies/usd.json",j=>[j.usd&&j.usd.kzt,fmtDate(j.date)]],
    ["https://open.er-api.com/v6/latest/USD",j=>[j.rates&&j.rates.KZT,fmtDate(j.time_last_update_utc)]]
  ];
  for(const [u,f] of SRC){
    try{
      const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),6000);
      const r=await fetch(u,{signal:ctl.signal,cache:"no-store"});clearTimeout(tm);
      if(!r.ok)continue;const [v,d]=f(await r.json());
      if(useRate(v,d)){try{localStorage.setItem("usdkzt",JSON.stringify({v,d,ts:Date.now()}))}catch(e){}return;}
    }catch(e){}
  }
})();
